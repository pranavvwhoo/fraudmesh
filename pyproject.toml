[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudmesh"
version = "0.1.0"
description = "Privacy-preserving federated graph learning framework for fraud and AML ring detection"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
include = ["fraudmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.ruff]
target-version = "py313"
line-length = 88